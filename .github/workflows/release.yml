name: Release

# Runs when you push a version tag like v1.0.0. Builds the Windows exe and
# publishes a GitHub Release with it attached. See RELEASING.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # required to create the Release and upload the exe asset

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app + build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build the executable
        run: python scripts/build.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WF-PriceTracker.exe
          generate_release_notes: true   # auto changelog from merged PRs/commits
          fail_on_unmatched_files: true
